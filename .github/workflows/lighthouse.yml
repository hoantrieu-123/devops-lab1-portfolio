# ============================================================
# DevOps Lab 1 — Lighthouse CI Audit với GitHub Actions
# Tự động chấm điểm Performance, Accessibility, Best Practices, SEO
# ============================================================

name: Lighthouse CI Audit

# === Khi nào pipeline chạy? ===
on:
  push:
    branches: [main, gh-pages]
  pull_request:
    branches: [main]
  workflow_dispatch:

# === Các job kiểm thử ===
jobs:
  lighthouse-audit:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code từ GitHub
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Audit tự động với Lighthouse CI
      - name: Audit with Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: './lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true

